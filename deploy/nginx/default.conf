limit_req_zone $binary_remote_addr zone=teleflow_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=teleflow_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=teleflow_webhook:10m rate=60r/s;

upstream teleflow_api {
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 22m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /metrics {
        return 404;
    }

    location = /api/v1/auth/login {
        limit_req zone=teleflow_login burst=5 nodelay;
        proxy_pass http://teleflow_api;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /hooks/telegram/ {
        client_max_body_size 3m;
        limit_req zone=teleflow_webhook burst=120 nodelay;
        proxy_pass http://teleflow_api;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 20s;
    }

    location /api/ {
        limit_req zone=teleflow_api burst=40 nodelay;
        proxy_pass http://teleflow_api;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://teleflow_api;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
