# Host-level reverse proxy in front of docker-compose.prod.yml.
limit_req_zone $binary_remote_addr zone=teleflow_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=teleflow_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=teleflow_webhook:10m rate=60r/s;

upstream teleflow_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name panel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 22m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /metrics { return 404; }

    location = /api/v1/auth/login {
        limit_req zone=teleflow_login burst=5 nodelay;
        proxy_pass http://teleflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location /hooks/telegram/ {
        client_max_body_size 3m;
        limit_req zone=teleflow_webhook burst=120 nodelay;
        proxy_pass http://teleflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 20s;
    }

    location / {
        limit_req zone=teleflow_api burst=40 nodelay;
        proxy_pass http://teleflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 90s;
    }
}
