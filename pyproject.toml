[project]
name = "teleflow-platform"
version = "2.5.0"
description = "Secure multi-tenant Telegram publishing and Business automation platform"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "TeleFlow" }]
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --disable-warnings --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["app/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "qrcode", "qrcode.*", "telethon", "telethon.*"]
ignore_missing_imports = true
