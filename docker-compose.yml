  TELEFLOW_CLAMAV_PORT: ${TELEFLOW_CLAMAV_PORT:-3310}
  TELEFLOW_CLAMAV_TIMEOUT_SECONDS: ${TELEFLOW_CLAMAV_TIMEOUT_SECONDS:-8}
  TELEFLOW_S3_ENDPOINT_URL: ${TELEFLOW_S3_ENDPOINT_URL:-}
  TELEFLOW_S3_REGION: ${TELEFLOW_S3_REGION:-us-east-1}
  TELEFLOW_S3_BUCKET: ${TELEFLOW_S3_BUCKET:-}
  TELEFLOW_S3_ACCESS_KEY: ${TELEFLOW_S3_ACCESS_KEY:-}
  TELEFLOW_S3_SECRET_KEY: ${TELEFLOW_S3_SECRET_KEY:-}
  TELEFLOW_LOG_LEVEL: ${TELEFLOW_LOG_LEVEL:-INFO}
  TELEFLOW_LOG_FORMAT: ${TELEFLOW_LOG_FORMAT:-text}
  TELEFLOW_METRICS_ENABLED: ${TELEFLOW_METRICS_ENABLED:-true}
  TELEFLOW_SENTRY_DSN: ${TELEFLOW_SENTRY_DSN:-}
  TELEFLOW_OTEL_ENABLED: ${TELEFLOW_OTEL_ENABLED:-false}
  TELEFLOW_OTEL_EXPORTER_OTLP_ENDPOINT: ${TELEFLOW_OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-app-security: &app-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teleflow
      POSTGRES_USER: teleflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teleflow_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teleflow -d teleflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-teleflow_redis_local}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-teleflow_redis_local}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-teleflow_redis_local}
    networks: [backend]
    security_opt:
      - no-new-privileges:true

  migrate:
    build: .
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    volumes:
      - app_storage:/app/storage
    restart: "no"
    <<: *app-security

  api:
    build: .
    restart: unless-stopped
    environment: *app-env
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --proxy-headers
      - --forwarded-allow-ips=*
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
    expose: ["8080"]
    networks: [backend]
    <<: *app-security

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
    networks: [backend]
    <<: *app-security

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${TELEFLOW_HTTP_BIND:-0.0.0.0}:${TELEFLOW_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [backend]
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    expose: ["9090"]
    networks: [backend]
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-observability}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]
    networks: [backend]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  app_storage:
  prometheus_data:
  grafana_data:

networks:
  backend:
    driver: bridge
