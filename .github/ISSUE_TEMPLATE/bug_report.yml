name: Сообщение об ошибке
description: Воспроизводимый дефект TeleFlow без чувствительных данных
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Не прикладывайте токены, Telegram session, персональные данные и production-архивы.
  - type: input
    id: version
    attributes:
      label: Версия
      placeholder: 2.5.0 или commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Окружение
      options: [development, test, staging, production]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Укажите минимальную последовательность и обезличенные входные данные.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат и безопасные логи
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Безопасность данных
      options:
        - label: Я удалил секреты и персональные данные из описания и вложений.
          required: true
