<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>TeleFlow — нет соединения</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #111827; background: #f5f7fb; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(520px, 100%); background: #fff; border: 1px solid #e5e7eb; border-radius: 20px; padding: 30px; box-shadow: 0 20px 55px rgba(15, 23, 42, .08); }
    .mark { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 16px; background: #4f46e5; color: #fff; font-weight: 800; }
    h1 { margin: 20px 0 8px; font-size: 26px; }
    p { color: #64748b; line-height: 1.55; }
    button { border: 0; border-radius: 11px; padding: 12px 18px; background: #4f46e5; color: #fff; font-weight: 700; cursor: pointer; }
    small { display: block; margin-top: 18px; color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <div class="mark">TF</div>
    <h1>Нет соединения с сервером</h1>
    <p>TeleFlow не хранит API-ответы, сообщения, контакты и данные авторизации в офлайн-кэше. Восстановите подключение и повторите загрузку.</p>
    <button type="button" onclick="location.reload()">Повторить</button>
    <small>Запланированные публикации продолжает обрабатывать серверный worker, если сам сервер доступен.</small>
  </main>
</body>
</html>
